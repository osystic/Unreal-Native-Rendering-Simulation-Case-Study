<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Sanitized Unreal engineering architecture</title><desc id="desc">Configuration feeds deterministic simulation and geometry, native Unreal integration and GPU rendering, followed by runtime presentation and layered validation.</desc><rect width="1200" height="520" fill="#0b1020"/><g font-family="Arial, Helvetica, sans-serif" fill="#eef2ff" text-anchor="middle"><text x="600" y="56" font-size="30" font-weight="700">Sanitized Unreal Engineering Architecture</text><g font-size="21"><rect x="70" y="120" width="240" height="90" rx="16" fill="#18233f" stroke="#7dd3fc" stroke-width="2"/><text x="190" y="155"><tspan x="190">Configuration &amp;</tspan><tspan x="190" dy="28">validation inputs</tspan></text><rect x="380" y="120" width="300" height="90" rx="16" fill="#18233f" stroke="#7dd3fc" stroke-width="2"/><text x="530" y="155"><tspan x="530">Deterministic simulation</tspan><tspan x="530" dy="28">&amp; geometry core</tspan></text><rect x="750" y="95" width="360" height="70" rx="16" fill="#18233f" stroke="#a7f3d0" stroke-width="2"/><text x="930" y="138">Native Unreal integration</text><rect x="750" y="190" width="360" height="70" rx="16" fill="#18233f" stroke="#c4b5fd" stroke-width="2"/><text x="930" y="233">GPU rendering path</text><rect x="380" y="310" width="300" height="85" rx="16" fill="#18233f" stroke="#fcd34d" stroke-width="2"/><text x="530" y="360">Runtime presentation</text><rect x="750" y="310" width="360" height="85" rx="16" fill="#18233f" stroke="#fb7185" stroke-width="2"/><text x="930" y="347"><tspan x="930">Layered validation</tspan><tspan x="930" dy="28">tests + runtime evidence</tspan></text></g></g><g stroke="#94a3b8" stroke-width="4" fill="none" marker-end="url(#a)"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs><path d="M310 165 H370"/><path d="M680 150 H740"/><path d="M680 185 H720 V225 H740"/><path d="M930 165 V185"/><path d="M820 260 V300 H680"/><path d="M530 210 V300"/><path d="M680 352 H740"/></g><text x="600" y="470" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">Public capability-level view only. Proprietary implementation details are intentionally omitted.</text></svg>
